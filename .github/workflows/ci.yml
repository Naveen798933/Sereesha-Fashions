name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_STORE_NAME: "Sreesha Elegance"
          NEXT_PUBLIC_STORE_CITY: "Hyderabad"
          NEXT_PUBLIC_STORE_STATE: "Telangana"
